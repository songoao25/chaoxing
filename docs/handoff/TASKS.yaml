  - id: A-doc-reading-duration
    title: 打通任务中心的文档阅读时长（2/5/10 分钟）
    status: blocked
    priority: P0
    owner: codex
    depends_on: [cap-doc-ac-mark]
    blocked_by: 两轮真实 5 分钟验证均 HTTP 200 但任务引擎仍未累计完成，需直接浏览器请求/平台状态证据
    context: |
      文档任务点完成条件是 planBreakthroughSet.documentWatchDuration（分钟）。
      阅读器每 30 秒向 data-xxt.aichaoxing.com/analysis/ac_mark 发一次 readPoint，
      服务端据此累计时长。当前实现照发了，但连打 10 分钟 + readEnd 后任务点仍未完成。
    files:
      - api/task_center.py          # study_document / _send_read_point / _read_document_points
      - tools/probe/04_文档阅读打点实验.py
      - tests/test_task_center.py
    steps:
      - 按 CAPTURE-PROTOCOL 抓 2 条不同时间的 ac_mark（Copy as cURL）+ 页面 markDataStr
      - 对比 d/t/enc，反推 enc（可能是 md5(d+t+固定盐) 或页面内 token 参与）
      - 在 api/task_center.py 复现签名；保留"失败即不完成"的行为
      - tools/probe/04 改为可配置 enc，跑通一个 5 分钟文档
    acceptance: |
      文档任务点在要求时长（±1 分钟）后 isFinish=true；
      enc 错误时必须返回 False 并写日志，不得假装完成。
    evidence:
      - api/task_center.py：addPoint.js 兼容的 17 位时间戳、encodeURIComponent(d) + 排序参数 MD5 签名
      - api/task_center.py：补齐浏览器跨域 ac_mark 的 Accept/Referer 请求头；打点 HTTP 失败不计完成
      - tests/test_task_center.py：脱敏样例签名回归、请求头回归、打点 HTTP 失败不计完成
      - make lint：当前 123 项离线单测全绿
      - 真实探针两轮：各 11 次打点均 HTTP 200，readEnd 返回成功，但最终 isFinish=false、任务进度仍为 0/15
      - 2026-09-21 两次完整真机复验（某企业/某车企，各 600 秒打点 + 结束时补 readEnd，等待 30/60/120 秒复查）：
        平台仍未计入，isFinish=false；结论：时长类文档的计账缺的不是 readEnd，
        需要对照阅读器 JS 的页面/滚动事件再查。已加 24 小时本地尝试台账，避免重复消耗真实阅读时间。

