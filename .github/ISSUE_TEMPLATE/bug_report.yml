name: Bug report
description: Report a reproducible problem with brushing, answering or the Task Center
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste cookies, passwords, API keys, full logs or captures containing tokens.
        Attach only the few sanitized log lines related to the problem (`~/.chaoxing/chaoxing.log`).
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.5 / 3.14.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: How you started it
      options:
        - ./cx (interactive wizard)
        - cx setup / cx --yes
        - python main.py -c config.ini
        - python main.py with command-line flags
        - python setup_wizard.py (Windows)
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where it went wrong
      options:
        - Login / cookies
        - Chapters (video / document / reading / quiz / live)
        - Task Center - video
        - Task Center - document
        - Task Center - homework
        - Task Center - AI practice
        - Task Center - topic discussion
        - Task Center - chapter sync
        - Answering / question bank / AI
        - Notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us which course you picked, what you chose to brush, and which step failed.
      placeholder: |
        1. Run ./cx
        2. Choose "chapters + Task Center"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Console output, a description of the platform status, or a sanitized log excerpt.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Sanitized log excerpt (optional)
      description: Paste only the relevant lines, and remove phone numbers, cookies, tokens and course ids.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I searched the issues and this is not a duplicate
          required: true
        - label: I removed every cookie, account number, API key and full log
          required: true
        - label: I tried running it again and the problem is still reproducible
          required: false
