name: Bug report
description: 报告可复现的刷课、答题或任务中心问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请**不要**粘贴 cookie、账号密码、API Key、完整日志或含 token 的抓包内容。
        日志请只附与问题相关的脱敏片段（`~/.chaoxing/chaoxing.log`）。
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.13.5 / 3.14.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: macOS 15 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: 运行入口
      options:
        - ./cx（交互式向导）
        - cx setup / cx --yes
        - python main.py -c config.ini
        - python main.py 命令行参数
        - python setup_wizard.py（Windows）
        - 其它
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的范围
      options:
        - 登录 / cookie
        - 章节（视频 / 文档 / 阅读 / 测验 / 直播）
        - 任务中心 · 视频
        - 任务中心 · 文档
        - 任务中心 · 作业
        - 任务中心 · AI 实践
        - 任务中心 · 主题讨论
        - 任务中心 · 章节同步
        - 答题 / 题库 / AI
        - 通知推送
        - 其它
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请写清选了什么课程、刷什么内容、第几步出错。
      placeholder: |
        1. 运行 ./cx
        2. 选择「章节 + 任务中心」
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 控制台提示、平台状态截图描述或脱敏后的日志片段。
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 脱敏日志片段（可选）
      description: 只粘贴相关几行，务必删除手机号、cookie、token、课程 ID。
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过 Issues，没有重复报告
          required: true
        - label: 我已删除所有 cookie、账号、API Key 与完整日志
          required: true
        - label: 我已尝试重新运行一次，问题仍可复现
          required: false
