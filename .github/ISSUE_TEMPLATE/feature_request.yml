name: Feature request
description: 提议与刷课、任务中心或答题直接相关的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么场景，现有行为哪里不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
  - type: textarea
    id: boundary
    attributes:
      label: 边界与合规说明
      description: |
        请说明是否涉及真实账号验证、平台接口改动或新的第三方服务。
        本项目不接受：伪造学习时长、绕过验证码/访问控制、伪造平台完成状态、商业化用途。
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过 Issues，没有重复提议
          required: true
        - label: 该需求不涉及伪造学习时长或平台完成状态
          required: true
