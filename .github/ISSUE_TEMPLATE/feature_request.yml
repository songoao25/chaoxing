name: Feature request
description: Suggest an improvement directly related to brushing, the Task Center or answering
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What situation did you hit, and where does the current behaviour fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: textarea
    id: boundary
    attributes:
      label: Scope and compliance
      description: |
        Say whether this needs verification with a real account, changes to platform APIs, or a new third-party service.
        This project does not accept: forged study time, bypassing captchas or access controls, faking platform completion status, or commercial use.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I searched the issues and this is not a duplicate
          required: true
        - label: This request does not involve forging study time or platform completion status
          required: true
